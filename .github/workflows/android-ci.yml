name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: gradle lintDebug --stacktrace

      - name: Configure Release Signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
          cat <<EOF > key.properties
          storePassword=$KEY_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Build Signed Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          gradle assembleRelease --stacktrace
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/PurePodcast-${SAFE_REF}.apk"

      - name: Build Debug APK (Fallback without signing secrets)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          gradle assembleDebug --stacktrace
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/PurePodcast-${SAFE_REF}-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurePodcast-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/PurePodcast-*.apk
            app/build/outputs/apk/debug/PurePodcast-*.apk

      - name: Remove signing material
        if: always()
        run: rm -f app/release-keystore.jks key.properties

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.KEYSTORE_BASE64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/PurePodcast-*.apk
